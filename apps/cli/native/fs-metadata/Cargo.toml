[package]
name = "relavium-fs-metadata"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi8"] }
napi-derive = { version = "=2.16.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Wdk_Storage_FileSystem", "Win32_System_IO"] }

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">From agent session to owned workflow runs</title>
  <desc id="desc">Four stages show an agent session becoming a proven flow, a committed Relavium YAML workflow, and observable runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0b1b28"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="53" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2.4">THE RELAVIUM CONTINUUM</text>
    <text x="60" y="84" fill="#f8fafc" font-size="24" font-weight="720">A conversation is the beginning, not the dead end.</text>

    <rect x="88" y="166" width="1024" height="4" rx="2" fill="#1e293b"/>
    <rect x="88" y="166" width="1024" height="4" rx="2" fill="url(#rail)" opacity="0.76"/>

    <g>
      <circle cx="130" cy="168" r="25" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2" filter="url(#glow)"/>
      <text x="130" y="174" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="130" y="223" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="750" letter-spacing="1.3">AGENT SESSION</text>
      <text x="130" y="247" text-anchor="middle" fill="#94a3b8" font-size="13">explore in conversation</text>
      <rect x="59" y="274" width="142" height="28" rx="14" fill="#1c1538" stroke="#4c1d95"/>
      <text x="130" y="293" text-anchor="middle" fill="#c4b5fd" font-size="11">persistent + tool-aware</text>
    </g>

    <g>
      <circle cx="438" cy="168" r="25" fill="#4f46e5" stroke="#a5b4fc" stroke-width="2" filter="url(#glow)"/>
      <text x="438" y="174" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="438" y="223" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="750" letter-spacing="1.3">PROVEN FLOW</text>
      <text x="438" y="247" text-anchor="middle" fill="#94a3b8" font-size="13">keep what actually works</text>
      <rect x="369" y="274" width="138" height="28" rx="14" fill="#151b3f" stroke="#3730a3"/>
      <text x="438" y="293" text-anchor="middle" fill="#a5b4fc" font-size="11">decisions + structure</text>
    </g>

    <g>
      <circle cx="746" cy="168" r="25" fill="#2563eb" stroke="#93c5fd" stroke-width="2" filter="url(#glow)"/>
      <text x="746" y="174" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">3</text>
      <text x="746" y="223" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="750" letter-spacing="1.3">.RELAVIUM.YAML</text>
      <text x="746" y="247" text-anchor="middle" fill="#94a3b8" font-size="13">review, diff, commit</text>
      <rect x="681" y="274" width="130" height="28" rx="14" fill="#10213d" stroke="#1d4ed8"/>
      <text x="746" y="293" text-anchor="middle" fill="#93c5fd" font-size="11">portable + git-native</text>
    </g>

    <g>
      <circle cx="1054" cy="168" r="25" fill="#0891b2" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
      <text x="1054" y="174" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">4</text>
      <text x="1054" y="223" text-anchor="middle" fill="#a5f3fc" font-size="13" font-weight="750" letter-spacing="1.3">OWN EVERY RUN</text>
      <text x="1054" y="247" text-anchor="middle" fill="#94a3b8" font-size="13">observe and operate</text>
      <rect x="987" y="274" width="134" height="28" rx="14" fill="#0d2933" stroke="#0e7490"/>
      <text x="1054" y="293" text-anchor="middle" fill="#67e8f9" font-size="11">events + history + gates</text>
    </g>

    <text x="600" y="327" text-anchor="middle" fill="#475569" font-size="11" font-weight="700" letter-spacing="2.1">ONE ENGINE · TWO ENTRY POINTS · REPEATABLE EXECUTION</text>
  </g>
</svg>

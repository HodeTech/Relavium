<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Relavium shared-engine architecture</title>
  <desc id="desc">CLI, desktop, VS Code, and cloud surfaces connect to one pure TypeScript engine with AgentSession and WorkflowEngine entry points, backed by shared contracts, an LLM seam, MCP, and durable storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="1" stop-color="#0b1825"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24164a"/>
      <stop offset="0.56" stop-color="#172049"/>
      <stop offset="1" stop-color="#0d3440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#cbd5e1" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="610" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="610" rx="24" fill="url(#grid)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="54" y="43" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2.4">SHARED-ENGINE ARCHITECTURE</text>

    <text x="54" y="78" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.8">SURFACES</text>
    <g fill="#111827" stroke="#334155" filter="url(#shadow)">
      <rect x="54" y="94" width="244" height="68" rx="16"/>
      <rect x="336" y="94" width="244" height="68" rx="16"/>
      <rect x="618" y="94" width="244" height="68" rx="16"/>
      <rect x="900" y="94" width="244" height="68" rx="16"/>
    </g>
    <circle cx="82" cy="128" r="8" fill="#22d3ee"/>
    <text x="104" y="124" fill="#f8fafc" font-size="15" font-weight="750">CLI</text>
    <text x="104" y="144" fill="#64748b" font-size="12">terminal + CI</text>
    <circle cx="364" cy="128" r="8" fill="#a78bfa"/>
    <text x="386" y="124" fill="#f8fafc" font-size="15" font-weight="750">Desktop</text>
    <text x="386" y="144" fill="#64748b" font-size="12">Tauri management center</text>
    <circle cx="646" cy="128" r="8" fill="#818cf8"/>
    <text x="668" y="124" fill="#f8fafc" font-size="15" font-weight="750">VS Code</text>
    <text x="668" y="144" fill="#64748b" font-size="12">authoring + execution</text>
    <circle cx="928" cy="128" r="8" fill="#34d399"/>
    <text x="950" y="124" fill="#f8fafc" font-size="15" font-weight="750">Cloud host</text>
    <text x="950" y="144" fill="#64748b" font-size="12">future workers + API</text>

    <path d="M176 164V207M458 164V207M740 164V207M1022 164V207" stroke="#475569" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M176 207H1022" stroke="#475569" stroke-width="2"/>
    <path d="M599 207V231" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="126" y="238" width="948" height="202" rx="26" fill="url(#engine)" stroke="url(#accent)" stroke-width="1.6"/>
      <text x="174" y="276" fill="#c4b5fd" font-size="12" font-weight="750" letter-spacing="2">@RELAVIUM/CORE</text>
      <text x="1028" y="276" text-anchor="end" fill="#67e8f9" font-size="11" font-weight="700">PURE TYPESCRIPT · ZERO PLATFORM IMPORTS</text>

      <rect x="174" y="300" width="382" height="76" rx="18" fill="#18152f" stroke="#7c3aed"/>
      <circle cx="210" cy="338" r="16" fill="#6d28d9"/>
      <path d="M202 334h16M202 342h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="242" y="333" fill="#f8fafc" font-size="17" font-weight="750">AgentSession</text>
      <text x="242" y="355" fill="#a5b4fc" font-size="12">conversational, multi-turn entry point</text>

      <rect x="644" y="300" width="382" height="76" rx="18" fill="#102534" stroke="#0891b2"/>
      <circle cx="680" cy="338" r="16" fill="#0e7490"/>
      <path d="M672 329v18M680 334v13M688 324v23" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="712" y="333" fill="#f8fafc" font-size="17" font-weight="750">WorkflowEngine</text>
      <text x="712" y="355" fill="#67e8f9" font-size="12">declarative DAG execution entry point</text>

      <rect x="174" y="392" width="852" height="28" rx="14" fill="#0d1525" stroke="#334155"/>
      <text x="600" y="411" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">TOOL REGISTRY · TYPED EVENT BUS · CHECKPOINT / RESUME · POLICY</text>
    </g>

    <path d="M271 441V484M490 441V484M710 441V484M929 441V484" stroke="#475569" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>

    <text x="54" y="487" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.8">HOST-INJECTED CAPABILITIES + SHARED CONTRACTS</text>
    <g fill="#101827" stroke="#334155">
      <rect x="54" y="504" width="238" height="66" rx="16"/>
      <rect x="338" y="504" width="238" height="66" rx="16"/>
      <rect x="622" y="504" width="238" height="66" rx="16"/>
      <rect x="906" y="504" width="238" height="66" rx="16"/>
    </g>
    <text x="173" y="531" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="750">@relavium/llm</text>
    <text x="173" y="552" text-anchor="middle" fill="#64748b" font-size="11">provider-neutral model seam</text>
    <text x="457" y="531" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="750">@relavium/shared</text>
    <text x="457" y="552" text-anchor="middle" fill="#64748b" font-size="11">Zod contracts + types</text>
    <text x="741" y="531" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="750">@relavium/mcp</text>
    <text x="741" y="552" text-anchor="middle" fill="#64748b" font-size="11">inbound tools + SDK fence</text>
    <text x="1025" y="531" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="750">@relavium/db</text>
    <text x="1025" y="552" text-anchor="middle" fill="#64748b" font-size="11">durable local / cloud stores</text>

    <text x="600" y="596" text-anchor="middle" fill="#475569" font-size="11" font-weight="700" letter-spacing="2">POLICY IN CORE · MECHANISM AT THE HOST · PROVIDERS BEHIND THE SEAM</text>
  </g>
</svg>

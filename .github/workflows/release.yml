# Relavium CLI release — pack once, smoke the exact artifact on every OS, then publish it (2.L · ADR-0051).
#
# Step 7b reuses the required installed-package runner, including the exact Node 22.0.0 runtime floor.
# Step 9 retains ownership of original-TS maps, release custody and their permission/discovery redesign.
#
# PUBLICATION IS REFUSED until that custody exists (Wave 3 Step 9a.1, the Interim release guard ruling of
# 2026-10-19): `publish` first runs a fail-closed guard that refuses every artifact. Only a verified release
# candidate (exact tarball, original ciphertext and release binding receipt) may publish, and Step 9d's custody
# validator, which replaces the guard, is what will verify one; Wave 4b supplies the production recipient. Until
# both exist every tag push stops at the guard, after the cross-OS smoke, so not even a v0.1.x patch publishes.
# The flow description below is the pre-custody shape the guard now blocks.
#
# Flow: `pack` builds the engine-inlined bundle and `pnpm pack`s it (resolving catalog:/workspace: to
# concrete versions) into a tarball artifact → `smoke` installs THAT SAME tarball outside the workspace on ubuntu /
# macOS / Windows and the minimum Node runtime and asserts the binary works (prebuilt native addons load, the bundled engine runs) →
# `publish` (only on a `v*` tag, gated on the strict packed aggregate) publishes the very artifact that was smoked, with
# npm provenance. The actual publish needs the maintainer's `NPM_TOKEN` secret — it is maintainer-gated,
# like branch protection. Verifying cross-OS BEFORE publish is the Phase-3 go/no-go #7 gate.
#
# Release refs must be reachable from `main`: `pack` asserts it before anything is built, so `smoke` and
# `publish` (which both chain off `pack`) inherit the guarantee. Possession of `NPM_TOKEN` is no longer the
# only real gate on what gets published. Two layers sit above this one, both in repo settings rather than
# here: branch protection on `main`, and a `v*` tag ruleset restricting tag creation to maintain/admin.
# The `allow_off_main` dispatch input is the maintainer escape hatch for building and smoking an unmerged
# BRANCH. It cannot reach a publish: `workflow_dispatch` accepts a tag ref as readily as a branch, so the
# ancestry assertion ignores the override whenever the ref is a `v*` tag, and `publish` additionally requires
# `github.event_name == 'push'` — a dispatched run never publishes, whatever ref or input it was given.
#
# Third-party actions are pinned to a commit SHA (the `# vX.Y.Z` comment tracks the release), matching ci.yml.
name: Release CLI

on:
  push:
    tags: ['v*']
  # Manual dry-run: build + smoke cross-OS without publishing (publish is gated on a tag below).
  workflow_dispatch:
    inputs:
      allow_off_main:
        description: 'Maintainer override — build + smoke a ref not reachable from main. Never publishes.'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Permissions are declared per job (least privilege) rather than workflow-wide.

jobs:
  pack:
    outputs:
      artifact-name: relavium-tarball-${{ github.run_id }}-${{ github.run_attempt }}
    name: build + pack the tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Full history for all branches: the main-ancestry assertion below cannot resolve `origin/main`
          # against the default shallow (depth-1) clone.
          fetch-depth: 0
      # The ref being released must already be on `main`. Without this, any commit on any branch could be
      # tagged `v*` and walk the whole pack → smoke → publish chain; the only other gate was that the tag
      # string matched package.json. Asserted here in `pack` so `smoke` and `publish` inherit it via `needs`.
      # A commit is its own ancestor, so tagging main's tip passes.
      # `allow_off_main` is honoured ONLY for a non-tag ref. A `workflow_dispatch` can target a tag just as
      # easily as a branch, so gating solely on the input would let a dispatch against an off-main `v*` tag
      # skip this assertion entirely — the override is scoped out of every tag ref for exactly that reason.
      - name: Release ref is reachable from `main`
        if: ${{ startsWith(github.ref, 'refs/tags/v') || !inputs.allow_off_main }}
        shell: bash
        run: |
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "✓ $GITHUB_SHA is reachable from origin/main"
          else
            echo "::error::Release refs must be reachable from main — $GITHUB_SHA is not."
            echo "::error::Merge it to main and tag the merged commit, or re-run via workflow_dispatch with allow_off_main=true (build + smoke only, never publishes)."
            exit 1
          fi
      # On a release tag, the tag must equal the CLI's package version — else we'd publish a mismatched
      # version. Fail fast (before build + the cross-OS smoke). Skipped on a manual dry-run (no tag).
      - name: Tag matches the CLI package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/cli/package.json').version")"
          test "$TAG" = "$PKG" || { echo "::error::release tag v$TAG != apps/cli/package.json version $PKG"; exit 1; }
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The same required package runner owns fresh dependencies and the sole prepack CLI build in an owned
      # candidate tree, where original-TS maps are built, validated, staged privately and discarded (Wave 3
      # Step 9a.1), with the private manifest and the packed-frame symbolication (Step 9a.2a); their
      # encrypted release custody is Steps 9b–9d. The receipt records package_test, a claim: the product map
      # controls run only in the CI workflow, and back an artifact only where a successful CI run exists at
      # exactly its commit (Step 9a.2b; packaging.md).
      - name: Pack once and independently inspect the public package
        env:
          RELAVIUM_PACKAGE_SOURCE_SHA: ${{ github.sha }}
        run: node tools/cli-package/pack.mjs "${{ runner.temp }}/packed-cli-artifact"
      - name: Upload the public tarball and package-test receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relavium-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packed-cli-artifact/*.tgz
            ${{ runner.temp }}/packed-cli-artifact/package-test-receipt.json
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: installed CLI (${{ matrix.id }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: current-linux
            os: ubuntu-latest
            node: '24'
          - id: current-macos
            os: macos-latest
            node: '24'
          - id: current-windows
            os: windows-latest
            node: '24'
          - id: minimum-linux
            os: ubuntu-latest
            node: '22.0.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Only the test runner and fixtures use this checkout. No workspace dependencies or build.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # An explicit version avoids evaluating the workspace's >=22.13 install floor on Node 22.0.0.
      - name: Set up pnpm for the external consumer
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.12.3
          run_install: false
      - name: Set up consumer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node == '22.0.0' && matrix.node || '' }}
          node-version-file: ${{ matrix.node != '22.0.0' && '.nvmrc' || '' }}
      - name: Download the exact packed CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact-name }}
          path: ${{ runner.temp }}/packed-cli-artifact
      - name: Install outside the workspace and exercise the actual package
        env:
          RELAVIUM_PACKAGE_LEG: ${{ matrix.id }}
          RELAVIUM_PACKAGE_SOURCE_SHA: ${{ github.sha }}
        run: node tools/cli-package/consume.mjs "${{ runner.temp }}/packed-cli-artifact" "${{ runner.temp }}/packed-cli-report"
      - name: Upload successful installed-package receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.pack.outputs.artifact-name }}-report-${{ matrix.id }}
          # A retried consumer replaces only its smoke receipt for the same immutable tarball.
          overwrite: true
          path: ${{ runner.temp }}/packed-cli-report/installed-consumer.json
          retention-days: 7
          if-no-files-found: error

  packed-cli:
    outputs:
      artifact-name: ${{ needs.pack.outputs.artifact-name }}
    name: require all installed CLI consumers
    needs: [pack, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Download the exact packed CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact-name }}
          path: ${{ runner.temp }}/packed-cli-artifact
      - name: Download all installed-package receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ needs.pack.outputs.artifact-name }}-report-*
          path: ${{ runner.temp }}/packed-cli-reports
          merge-multiple: false
      - name: Require pack and every consumer outcome and matching receipt
        env:
          RELAVIUM_PACKAGE_JOB_RESULTS: ${{ toJSON(needs) }}
          RELAVIUM_PACKAGE_SOURCE_SHA: ${{ github.sha }}
        run: node tools/cli-package/aggregate.mjs "${{ runner.temp }}/packed-cli-artifact" "${{ runner.temp }}/packed-cli-reports"

  publish:
    name: publish to npm (provenance)
    needs: packed-cli
    # Only a real pushed release tag publishes. `github.event_name == 'push'` is load-bearing, not
    # belt-and-suspenders: a `workflow_dispatch` can target a `v*` tag, so the ref check alone would let a
    # manually dispatched run publish. Every manual run now stops after the cross-OS smoke.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      # Checkout ONLY `.nvmrc` and the dependency-free publication guard, its entry point and its rule (sparse,
      # non-cone): `setup-node` reads the single Node-version source the pack/smoke jobs use too, and the guard
      # runs before any publish.
      # Publish needs no other repo files — it pushes the downloaded tarball, not a fresh build.
      # (fetch-depth defaults to 1, so it is not set again.)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            tools/cli-package/release-guard.mjs
            tools/cli-package/release-guard-core.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node (npm registry)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Download the smoked tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.packed-cli.outputs.artifact-name }}
          path: artifact
      # Interim fail-closed guard (Wave 3 Step 9a.1, the Interim release guard ruling of 2026-10-19): only a
      # verified release candidate may publish, and none can exist before Step 9d's custody graph and Wave 4b's
      # production recipient. Every artifact, including this package-test tarball, therefore stops here; the
      # entry point sets its exit code to 1 before it evaluates anything, so a rule that returns, throws or
      # cannot load still refuses, and no way of invoking it can skip the refusal.
      - name: Refuse anything but a verified release candidate
        run: node tools/cli-package/release-guard.mjs ./artifact
      # Publish the EXACT artifact the smoke matrix proved — not a fresh build. catalog:/workspace: are already
      # resolved in the packed manifest, so `npm publish <tarball>` is correct here (pnpm-pack did the resolving).
      - name: Publish
        shell: bash
        # `./` for the same reason as the smoke install: a bare `artifact/…tgz` is read by npm as a GitHub
        # `owner/repo` shorthand, not the local tarball. The `./artifact/*.tgz` glob forces the file spec and
        # expands to the single downloaded tarball — no `ls`/subshell needed.
        run: npm publish ./artifact/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
